<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gêneros</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/estilo.css' %}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-danger">
    <a class="navbar-brand" href="/">Filmes e Séries</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link text-white {% if request.path == '/' %}active font-weight-bold{% endif %}" href="/">Home</a></li>
            <li class="nav-item"><a class="nav-link text-white {% if request.path == '/filmes/' %}active font-weight-bold{% endif %}" href="/filmes/">Filmes</a></li>
            <li class="nav-item"><a class="nav-link text-white {% if request.path == '/series/' %}active font-weight-bold{% endif %}" href="/series/">Séries</a></li>
            <li class="nav-item"><a class="nav-link text-white {% if request.path == '/atores/' %}active font-weight-bold{% endif %}" href="/atores/">Atores</a></li>
            <li class="nav-item"><a class="nav-link text-white {% if request.path == '/diretores/' %}active font-weight-bold{% endif %}" href="/diretores/">Diretores</a></li>
            <li class="nav-item"><a class="nav-link text-white {% if request.path == '/generos/' %}active font-weight-bold{% endif %}" href="/generos/">Gêneros</a></li>
            <li class="nav-item"><a class="nav-link text-white {% if request.path == '/paises/' %}active font-weight-bold{% endif %}" href="/paises/">Países</a></li>
            <li class="nav-item"><a class="nav-link text-white {% if request.path == '/continentes/' %}active font-weight-bold{% endif %}" href="/continentes/">Continentes</a></li>
            <li class="nav-item"><a class="nav-link text-white {% if request.path == '/temporadas/' %}active font-weight-bold{% endif %}" href="/temporadas/">Temporadas</a></li>
            <li class="nav-item"><a class="nav-link text-white {% if request.path == '/episodios/' %}active font-weight-bold{% endif %}" href="/episodios/">Episódios</a></li>
            <li class="nav-item"><a class="nav-link text-white {% if request.path == '/admin/' %}active font-weight-bold{% endif %}" href="/admin/">Administração</a></li>
        </ul>
    </div>
</nav>

<div class="container mt-5">
    <h2 class="mb-4">Lista de Gêneros</h2>
    <table class="table table-striped table-hover table-bordered table-smiped table-hover">
        <thead class="thead-dark">
            <tr>
                <th>Nome</th>
            </tr>
        </thead>
        <tbody>
            {% for genero in generos %}
            <tr>
                <td>{{ genero.nome }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="1">Nenhum gênero cadastrado.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.1/dist/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
